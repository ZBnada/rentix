<header class="sticky top-0 z-999 flex w-full bg-white border-b border-gray-200 dark:bg-gray-dark dark:border-gray-800">
    <div class="flex flex-grow items-center justify-between px-4 py-4 md:px-6 2xl:px-11">

        <!-- Left Side: Menu Toggle + Search -->
        <div class="flex items-center gap-4">
            <!-- Menu Toggle Button (Desktop & Mobile) -->
            <button
                    (click)="handleToggleSidebar()"
                    type="button"
                    aria-label="Toggle sidebar"
                    class="flex items-center justify-center rounded-lg border border-gray-200 bg-white p-2 shadow-sm dark:border-gray-800 dark:bg-gray-dark hover:bg-gray-100 dark:hover:bg-gray-900 transition-colors">
                <svg class="w-6 h-6 text-gray-700 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>

            <!-- Search Bar -->
            <form action="#" method="POST" (submit)="$event.preventDefault()" class="hidden sm:block">
                <div class="relative">
                    <button class="absolute left-0 top-1/2 -translate-y-1/2 pl-4" type="button" aria-label="Search">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </button>
                    <input
                            type="text"
                            placeholder="Search or type command..."
                            class="w-full bg-gray-50 dark:bg-gray-900 pr-4 pl-11 py-2.5 rounded-lg border border-gray-200 dark:border-gray-800 focus:outline-none focus:ring-2 focus:ring-orange-500 dark:text-white xl:w-125 text-sm">
                    <kbd class="absolute right-4 top-1/2 -translate-y-1/2 hidden xl:inline-flex items-center gap-1 rounded border border-gray-200 dark:border-gray-800 px-2 py-1 text-xs font-medium text-gray-500 dark:text-gray-400">
                        ⌘K
                    </kbd>
                </div>
            </form>
        </div>

        <!-- Right Side: Dark Mode + User -->
        <div class="flex items-center gap-3 2xsm:gap-7">

            <!-- Dark Mode Toggle -->
            <button
                    (click)="toggleDarkMode()"
                    type="button"
                    aria-label="Toggle dark mode"
                    class="relative flex h-8.5 w-8.5 items-center justify-center rounded-full border border-gray-200 dark:border-gray-800 hover:bg-gray-100 dark:hover:bg-gray-900 transition-colors">
                @if (!isDarkMode()) {
                    <svg class="w-5 h-5 text-gray-700 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                    </svg>
                } @else {
                    <svg class="w-5 h-5 text-gray-700 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                    </svg>
                }
            </button>

            <!-- User Area -->
            <div class="relative">
                <button
                        (click)="toggleUserDropdown()"
                        type="button"
                        aria-label="User menu"
                        [attr.aria-expanded]="showUserDropdown()"
                        class="flex items-center gap-4">
                    <span class="hidden text-right lg:block">
                        <span class="block text-sm font-medium text-gray-900 dark:text-white">
                            {{ getUserName() }}
                        </span>
                        <span class="block text-xs text-gray-500 dark:text-gray-400">
                            {{ getUserEmail() }}
                        </span>
                    </span>

                    <!-- Avatar: Image OU Initiales -->
                    @if (shouldShowImage()) {
                        <img
                                [src]="userAvatarUrl()"
                                [alt]="getUserName()"
                                (error)="onAvatarError()"
                                class="h-12 w-12 rounded-full object-cover ring-2 ring-gray-200 dark:ring-gray-700 shadow-md"
                        />
                    } @else {
                        <span class="h-12 w-12 rounded-full bg-gradient-to-br from-orange-500 to-orange-600 flex items-center justify-center text-white font-bold text-lg shadow-md">
                            {{ getUserInitials() }}
                        </span>
                    }

                    <svg class="hidden fill-current text-gray-700 dark:text-gray-400 sm:block transition-transform"
                         [class.rotate-180]="showUserDropdown()"
                         width="12" height="8" viewBox="0 0 12 8">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M0.410765 0.910734C0.736202 0.585297 1.26384 0.585297 1.58928 0.910734L6.00002 5.32148L10.4108 0.910734C10.7362 0.585297 11.2638 0.585297 11.5893 0.910734C11.9147 1.23617 11.9147 1.76381 11.5893 2.08924L6.58928 7.08924C6.26384 7.41468 5.7362 7.41468 5.41077 7.08924L0.410765 2.08924C0.0853277 1.76381 0.0853277 1.23617 0.410765 0.910734Z"/>
                    </svg>
                </button>

                <!-- Dropdown Menu -->
                @if (showUserDropdown()) {
                    <!-- Backdrop -->
                    <div class="fixed inset-0 z-40" (click)="closeUserDropdown()"></div>

                    <!-- Dropdown -->
                    <div class="absolute right-0 mt-4 flex w-62.5 flex-col rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-dark shadow-lg z-50 animate-in fade-in slide-in-from-top-2 duration-200">
                        <!-- User Info Header -->
                        <div class="flex items-center gap-3 px-6 py-5 border-b border-gray-200 dark:border-gray-800">
                            @if (shouldShowImage()) {
                                <img
                                        [src]="userAvatarUrl()"
                                        [alt]="getUserName()"
                                        (error)="onAvatarError()"
                                        class="h-12 w-12 rounded-full object-cover ring-2 ring-gray-200 dark:ring-gray-700"
                                />
                            } @else {
                                <span class="h-12 w-12 rounded-full bg-gradient-to-br from-orange-500 to-orange-600 flex items-center justify-center text-white font-bold text-lg">
                                    {{ getUserInitials() }}
                                </span>
                            }
                            <div>
                                <p class="text-sm font-medium text-gray-900 dark:text-white">{{ getUserName() }}</p>
                                <p class="text-xs text-gray-500 dark:text-gray-400">{{ getUserEmail() }}</p>
                            </div>
                        </div>

                        <!-- Menu Items -->
                        <ul class="flex flex-col gap-1 p-2">
                            <li>
                                <button
                                        (click)="navigateToProfile()"
                                        type="button"
                                        class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-900 w-full text-left transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                    </svg>
                                    Edit profile
                                </button>
                            </li>
                            <li>
                                <button
                                        (click)="navigateToSettings()"
                                        type="button"
                                        class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-900 w-full text-left transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    </svg>
                                    Account settings
                                </button>
                            </li>
                            <li>
                                <button
                                        (click)="handleSupport()"
                                        type="button"
                                        class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-900 w-full text-left transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                    </svg>
                                    Support
                                </button>
                            </li>
                        </ul>

                        <!-- Logout -->
                        <div class="border-t border-gray-200 dark:border-gray-800 p-2">
                            <button
                                    (click)="handleLogout()"
                                    type="button"
                                    class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium text-red-600 dark:text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 w-full text-left transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                                </svg>
                                Sign out
                            </button>
                        </div>
                    </div>
                }
            </div>
        </div>
    </div>
</header>
