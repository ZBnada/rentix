<!-- Navbar -->
<nav class="bg-black text-white px-6 py-4 flex items-center justify-between sticky top-0 z-50">
    <!-- Left: Hamburger + Logo -->
    <div class="flex items-center gap-4">
        <button
                (click)="handleToggleSidebar()"
                class="p-2 hover:bg-gray-800 rounded-lg transition-colors"
                aria-label="Toggle menu">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>

        <!-- Logo RentIX -->
        <div class="flex items-center gap-2">
            <a href="/" class="text-2xl font-black tracking-tight">
                Rent<span class="text-orange-500">I</span>X
            </a>
            <div class="text-xs uppercase tracking-wider text-gray-400 mt-1">
                RENT THE CAR
            </div>
        </div>
    </div>

    <!-- Right: Actions -->
    <div class="flex items-center gap-6">
        <button class="hidden md:flex items-center gap-2 hover:text-orange-500 transition-colors">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/>
            </svg>
            <span class="text-sm font-medium">Manage bookings</span>
        </button>

        <button class="hidden md:flex items-center gap-2 hover:text-orange-500 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span class="text-sm font-medium">EN | $</span>
        </button>

        @if (!isLoggedIn()) {
            <button
                    (click)="openLoginModal()"
                    class="flex items-center gap-2 hover:text-orange-500 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
                <span class="text-sm font-medium">Log in | Register</span>
            </button>
        } @else {
            <div class="flex items-center gap-4">
                <span class="text-sm font-medium">Hello, {{ getUserFirstName() }}</span>
                <button
                        (click)="logout()"
                        class="text-sm font-medium text-red-500 hover:text-red-400 transition-colors">
                    Logout
                </button>
            </div>
        }
    </div>
</nav>

<!-- Login Modal -->
@if (showLoginModal()) {
    <app-login-modal
            (closeModal)="closeLoginModal()"
            (switchToRegister)="switchToRegister()" />
}

<!-- Register Type Selection Modal -->
@if (showRegisterTypeModal()) {
    <app-register-type-modal
            (closeModal)="closeRegisterTypeModal()"
            (selectUserType)="onSelectUserType($event)" />
}
