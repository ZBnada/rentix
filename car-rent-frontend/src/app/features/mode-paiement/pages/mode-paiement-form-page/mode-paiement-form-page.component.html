<div class="mx-auto max-w-6xl space-y-6">
    <!-- Back Button -->
    <button (click)="onCancel()" type="button"
            class="flex items-center gap-2 text-gray-600 transition-colors hover:text-gray-900">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
        </svg>
        Back to list
    </button>

    <div class="p-6">
        @if (isLoading()) {
            <div class="flex justify-center items-center py-12">
                <div class="w-10 h-10 border-4 border-slate-200 border-t-slate-600 rounded-full animate-spin"></div>
            </div>
        } @else {
            <div class="mb-6">
                <h1 class="text-2xl font-bold text-gray-900">{{ pageTitle() }}</h1>
                <p class="text-sm text-gray-500 mt-1">
                    {{ isEditMode() ? 'Update the payment method information' : 'Create a new payment method' }}
                </p>
            </div>

            <div class="max-w-2xl bg-white rounded-2xl border border-gray-200 shadow-sm p-6">
                <app-mode-paiement-form
                        [initialData]="initialData()"
                        [isEditMode]="isEditMode()"
                        (submitForm)="onSubmit($event)"
                        (cancel)="onCancel()"/>
            </div>
        }
    </div>
</div>
