<div class="relative">
    <!-- Bell Button -->
    <button
            (click)="togglePanel()"
            class="relative flex h-10 w-10 items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-900 transition-colors duration-200"
            [class.bg-gray-100]="isOpen()"
            [class.dark:bg-gray-900]="isOpen()">

        <!-- Bell Icon -->
        <svg
                class="h-6 w-6 text-gray-700 dark:text-gray-400"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24">
            <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>

        <!-- Unread Badge -->
        @if ((unreadCount$ | async) ?? 0 > 0) {
            <span
                    class="absolute -top-0.5 -right-0.5 flex h-5 min-w-[1.25rem] items-center justify-center rounded-full bg-error-500 px-1 text-xs font-bold text-white animate-in">
        {{ ((unreadCount$ | async) ?? 0) > 99 ? '99+' : (unreadCount$ | async) }}
      </span>

            <!-- Ping Animation -->
            <span class="absolute -top-0.5 -right-0.5 flex h-5 w-5">
        <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-error-400 opacity-75"></span>
      </span>
        }

        <!-- Connection Status Indicator (optional) -->
        @if ((isConnected$ | async) === false) {
            <span
                    class="absolute bottom-0 right-0 h-2.5 w-2.5 rounded-full bg-warning-500 border-2 border-white dark:border-gray-dark"
                    title="Connecting...">
      </span>
        }
    </button>

    <!-- Notification Panel -->
    @if (isOpen()) {
        <!-- Overlay (mobile only) -->
        <div
                class="fixed inset-0 z-40 bg-black/20 lg:hidden"
                (click)="closePanel()">
        </div>

        <!-- Panel -->
        <div class="absolute right-0 mt-2.5 flex w-80 sm:w-96 flex-col rounded-lg border border-gray-200 bg-white shadow-lg dark:border-gray-800 dark:bg-gray-dark z-50 animate-in">
            <app-notification-panel (closePanel)="closePanel()"></app-notification-panel>
        </div>
    }
</div>
