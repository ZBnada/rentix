<!-- src/app/features/profile/components/profile-image-uploader/profile-image-uploader.component.html -->

<div class="flex flex-col items-center space-y-6">
    <!-- Profile Image Display with Modern Design -->
    <div class="relative group">
        <!-- Main Avatar Container -->
        <div class="relative w-40 h-40">
            <!-- Animated Orange Ring -->
            <div class="absolute inset-0 rounded-2xl border-4 border-orange-500/30 group-hover:border-orange-500 group-hover:scale-110 transition-all duration-300"></div>

            <!-- Avatar Background -->
            <div class="relative w-full h-full rounded-2xl overflow-hidden bg-gradient-to-br from-gray-800 to-gray-900 flex items-center justify-center text-white text-4xl font-bold shadow-2xl border-4 border-gray-800">
                <img
                        *ngIf="imageUrl"
                        [src]="imageUrl"
                        [alt]="firstName + ' ' + lastName"
                        class="w-full h-full object-cover"
                />
                <span *ngIf="!imageUrl" class="bg-gradient-to-br from-orange-500 to-orange-600 bg-clip-text text-transparent">
                    {{ initials }}
                </span>
            </div>
        </div>

        <!-- Hover Overlay with Upload Icon -->
        <div [ngClass]="{'opacity-0 group-hover:opacity-100': !isUploading, 'opacity-100': isUploading}"
             class="absolute inset-0 bg-black/70 backdrop-blur-sm rounded-2xl flex items-center justify-center transition-all duration-300 cursor-pointer">
            <label class="cursor-pointer flex flex-col items-center gap-2" *ngIf="!isUploading">
                <input
                        type="file"
                        class="hidden"
                        accept="image/jpeg,image/jpg,image/png,image/webp"
                        (change)="onFileSelected($event)"
                        [disabled]="isUploading"
                />
                <div class="w-14 h-14 rounded-full bg-orange-500 flex items-center justify-center shadow-lg shadow-orange-500/50 group-hover:scale-110 transition-transform">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </div>
                <span class="text-xs font-semibold text-white">Upload Photo</span>
            </label>

            <!-- Loading Spinner -->
            <div *ngIf="isUploading" class="flex flex-col items-center gap-3">
                <div class="relative">
                    <div class="w-12 h-12 border-4 border-gray-700 rounded-full"></div>
                    <div class="absolute inset-0 w-12 h-12 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
                </div>
                <span class="text-sm font-semibold text-white">Uploading...</span>
            </div>
        </div>

        <!-- Camera Icon Badge -->
        <div class="absolute -bottom-2 -right-2 w-12 h-12 rounded-full bg-gradient-to-br from-orange-500 to-orange-600 border-4 border-gray-900 flex items-center justify-center shadow-xl cursor-pointer group-hover:scale-110 transition-transform">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex gap-3">
        <label class="btn-primary cursor-pointer inline-flex items-center gap-2 shadow-lg shadow-orange-500/30 hover:shadow-orange-500/50 transition-all">
            <input
                    type="file"
                    class="hidden"
                    accept="image/jpeg,image/jpg,image/png,image/webp"
                    (change)="onFileSelected($event)"
                    [disabled]="isUploading"
            />
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
            </svg>
            <span *ngIf="isUploading">Uploading...</span>
            <span *ngIf="!isUploading">Change Photo</span>
        </label>

        <button
                *ngIf="imageUrl"
                type="button"
                (click)="deleteImage()"
                [disabled]="isUploading"
                class="px-5 py-2.5 bg-gray-800 hover:bg-red-600 text-white font-medium rounded-lg transition-all duration-200 border border-gray-700 hover:border-red-600 disabled:opacity-50 disabled:cursor-not-allowed inline-flex items-center gap-2 shadow-lg">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            Delete
        </button>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage"
         class="w-full px-4 py-3 bg-red-50 border-l-4 border-red-500 rounded-lg flex items-start gap-3 animate-in">
        <svg class="w-5 h-5 text-red-500 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
        </svg>
        <div class="flex-1">
            <p class="text-sm font-semibold text-red-800">Upload Failed</p>
            <p class="text-sm text-red-600 mt-0.5">{{ errorMessage }}</p>
        </div>
    </div>

    <!-- Info Card -->
    <div class="w-full max-w-sm p-4 bg-gray-50 border border-gray-200 rounded-lg">
        <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-lg bg-orange-100 flex items-center justify-center flex-shrink-0">
                <svg class="w-5 h-5 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <div class="flex-1">
                <h4 class="text-sm font-semibold text-gray-900 mb-1">Image Requirements</h4>
                <ul class="text-xs text-gray-600 space-y-1">
                    <li class="flex items-center gap-1.5">
                        <svg class="w-3 h-3 text-orange-500" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                        </svg>
                        Formats: JPG, PNG, WEBP
                    </li>
                    <li class="flex items-center gap-1.5">
                        <svg class="w-3 h-3 text-orange-500" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                        </svg>
                        Maximum size: 5 MB
                    </li>
                    <li class="flex items-center gap-1.5">
                        <svg class="w-3 h-3 text-orange-500" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                        </svg>
                        Recommended: Square image (1:1 ratio)
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
