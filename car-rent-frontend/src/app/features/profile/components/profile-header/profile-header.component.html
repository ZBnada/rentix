<!-- src/app/features/profile/components/profile-header/profile-header.component.html -->

<div class="bg-white border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex flex-col md:flex-row items-center md:items-start gap-6">

            <!-- Profile Image Section -->
            <div class="flex-shrink-0">
                <div class="relative">
                    <!-- Main Avatar with Orange Border -->
                    <div class="w-32 h-32 rounded-full overflow-hidden border-4 border-orange-500 shadow-xl bg-white relative group">
                        <img *ngIf="imageUrl"
                             [src]="imageUrl"
                             [alt]="fullName"
                             class="w-full h-full object-cover">

                        <div *ngIf="!imageUrl"
                             class="w-full h-full flex items-center justify-center bg-gradient-to-br from-orange-500 to-orange-600 text-white text-4xl font-bold">
                            {{ initials }}
                        </div>

                        <!-- Hover Overlay -->
                        <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-30 transition-all duration-300 flex items-center justify-center opacity-0 group-hover:opacity-100">
                            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                            </svg>
                        </div>
                    </div>

                    <!-- Active Status Badge -->
                    <div class="absolute bottom-1 right-1 w-8 h-8 bg-white rounded-full flex items-center justify-center shadow-lg border-2 border-white">
                        <div class="w-5 h-5 bg-green-500 rounded-full animate-pulse"></div>
                    </div>
                </div>
            </div>

            <!-- Profile Information Section -->
            <div class="flex-1 text-center md:text-left">
                <!-- Name and Verification -->
                <div class="flex items-center justify-center md:justify-start gap-3 mb-3">
                    <h1 class="text-3xl font-bold text-gray-900">{{ fullName }}</h1>
                    <span *ngIf="profile?.isEmailVerified"
                          class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-700 border border-green-200">
                        <svg class="w-3.5 h-3.5 mr-1" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                        </svg>
                        Verified
                    </span>
                </div>

                <!-- Email and Role -->
                <div class="flex flex-wrap items-center justify-center md:justify-start gap-3 mb-4">
                    <span class="inline-flex items-center px-3 py-1.5 rounded-lg text-sm font-medium bg-gray-100 text-gray-700 border border-gray-200">
                        <svg class="w-4 h-4 mr-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                        {{ profile?.email }}
                    </span>

                    <span class="inline-flex items-center px-3 py-1.5 rounded-lg text-sm font-semibold bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-md">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
                        </svg>
                        {{ profile?.role?.name || 'Member' }}
                    </span>
                </div>

                <!-- Stats Cards - Horizontal Layout -->
                <div class="flex flex-wrap gap-4 justify-center md:justify-start">
                    <!-- Member Since -->
                    <div class="flex items-center gap-2.5 px-4 py-2.5 bg-gray-50 rounded-lg border border-gray-200 hover:border-orange-300 transition-colors">
                        <div class="w-9 h-9 rounded-lg bg-orange-100 flex items-center justify-center flex-shrink-0">
                            <svg class="w-5 h-5 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 font-medium">Member Since</p>
                            <p class="text-sm font-bold text-gray-900">{{ memberSinceDays }} days</p>
                        </div>
                    </div>

                    <!-- Last Login -->
                    <div *ngIf="profile?.lastLoginAt" class="flex items-center gap-2.5 px-4 py-2.5 bg-gray-50 rounded-lg border border-gray-200 hover:border-orange-300 transition-colors">
                        <div class="w-9 h-9 rounded-lg bg-orange-100 flex items-center justify-center flex-shrink-0">
                            <svg class="w-5 h-5 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 font-medium">Last Login</p>
                            <p class="text-sm font-bold text-gray-900">{{ daysSinceLastLogin }} days ago</p>
                        </div>
                    </div>

                    <!-- Profile Completeness -->
                    <div class="flex items-center gap-2.5 px-4 py-2.5 bg-orange-50 rounded-lg border border-orange-200 hover:border-orange-300 transition-colors">
                        <div class="w-9 h-9 rounded-lg bg-orange-500 flex items-center justify-center flex-shrink-0">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <div>
                            <p class="text-xs text-orange-700 font-medium">Profile Complete</p>
                            <div class="flex items-center gap-2">
                                <p class="text-sm font-bold text-orange-900">{{ profileCompleteness }}%</p>
                                <div class="w-16 h-1.5 bg-orange-200 rounded-full overflow-hidden">
                                    <div class="h-full bg-orange-500 rounded-full transition-all duration-500"
                                         [style.width.%]="profileCompleteness"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
