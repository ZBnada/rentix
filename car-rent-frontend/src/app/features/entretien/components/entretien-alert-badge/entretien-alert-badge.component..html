<!-- src/app/features/entretien/components/entretien-alert-badge/entretien-alert-badge.component.html -->

@if (alert && alert.type !== alertTypes.NONE) {
    <div
            class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-sm font-medium transition-all"
            [ngClass]="[alert.color, alert.bgColor]">

        <!-- Icon -->
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            @switch (alert.icon) {
                @case ('x-circle') {
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                }
                @case ('alert-circle') {
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                }
                @case ('clock') {
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                }
                @case ('info') {
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                }
                @default {
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                }
            }
        </svg>

        <!-- Message -->
        <span>{{ alert.message }}</span>

        <!-- Days remaining badge (optional) -->
        @if (showDaysCount && alert.daysRemaining >= 0) {
            <span class="ml-1 px-2 py-0.5 rounded-full bg-white/20 text-xs font-bold">
        {{ alert.daysRemaining }}j
      </span>
        }
    </div>
}
