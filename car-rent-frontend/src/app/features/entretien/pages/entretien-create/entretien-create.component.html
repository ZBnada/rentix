<div class="mx-auto max-w-6xl space-y-6">

<button
            (click)="onCancel()"
            type="button"
            class="flex items-center gap-2 text-gray-600 transition-colors hover:text-gray-900 dark:text-gray-400 dark:hover:text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
        </svg>
        Back to list
    </button>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="flex items-center justify-center py-12">
        <div class="flex flex-col items-center gap-3">
            <svg class="animate-spin h-10 w-10 text-orange-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-gray-600">Loading form data...</p>
        </div>
    </div>

    <!-- Content -->
    <div *ngIf="!isLoading">
        <!-- Page Title -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-900">New Maintenance Record</h1>
            <p class="text-sm text-gray-600 mt-1">
                Create a new maintenance record for a vehicle
            </p>
        </div>

        <!-- Form Component -->
        <app-entretien-form
                [isEditMode]="false"
                [typesEntretien]="typesEntretien"
                [vehicules]="vehicules"
                (submitForm)="onSubmit($event)"
                (cancel)="onCancel()"
        ></app-entretien-form>
    </div>
</div>
