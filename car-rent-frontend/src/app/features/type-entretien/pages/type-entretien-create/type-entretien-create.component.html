<div class="mx-auto max-w-6xl space-y-6">

    <button
            (click)="onCancel()"
            type="button"
            class="flex items-center gap-2 text-gray-600 transition-colors hover:text-gray-900 dark:text-gray-400 dark:hover:text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
        </svg>
        Back to list
    </button>


    <!-- Page Title -->
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Créer un nouveau type d'entretien</h1>
        <p class="text-sm text-gray-600 mt-1">
            Remplissez les informations ci-dessous pour créer un nouveau type d'entretien
        </p>
    </div>

    <!-- Form Component -->
    <app-type-entretien-form
            [isEditMode]="false"
            (submitForm)="onSubmit($event)"
            (cancel)="onCancel()"
    ></app-type-entretien-form>
</div>
