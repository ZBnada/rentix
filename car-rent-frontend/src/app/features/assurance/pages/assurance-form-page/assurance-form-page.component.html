<div class="p-6">
    <!-- Loading State -->
    @if (isLoading()) {
        <div class="flex justify-center items-center py-12">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-orange-500"></div>
        </div>
    }

    <!-- Formulaire -->
    @else {
        <!-- Header -->
        <div class="mb-6">
            <nav class="flex items-center gap-2 text-sm text-gray-500 mb-4">
                <a routerLink="/dashboard/assurances" class="hover:text-orange-500 transition-colors">
                    Assurances
                </a>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
                <span class="text-gray-900 font-medium">{{ pageTitle() }}</span>
            </nav>

            <h1 class="text-2xl font-bold text-gray-900">{{ pageTitle() }}</h1>
            <p class="text-sm text-gray-500 mt-1">
                {{ isEditMode() ? 'Modifiez les informations de l\'assurance' : 'Créez une nouvelle assurance pour un véhicule' }}
            </p>
        </div>

        <!-- Carte formulaire -->
        <div class="max-w-5xl bg-white rounded-lg shadow-md p-6">
            <app-assurance-form
                    [initialData]="initialData()"
                    [vehicules]="vehicules()"
                    [modesPaiement]="modesPaiement()"
                    [isEditMode]="isEditMode()"
                    (submitForm)="onSubmit($event)"
                    (cancel)="onCancel()"
            />
        </div>
    }
</div>
