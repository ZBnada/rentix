<section class="bg-gray-900 py-16 md:py-20">
    <div class="max-w-7xl mx-auto px-6">
        <!-- Section Title -->
        <div class="text-center mb-12">
            <h2 class="text-3xl md:text-4xl lg:text-5xl font-black text-white mb-4">
                THE PERFECT CAR FOR YOUR NEXT TRIP FROM ATHENS INTERNATIONAL AIRPORT
            </h2>
        </div>

        <!-- Cars Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            @for (car of cars; track car.name) {
                <div class="bg-gray-800 rounded-2xl overflow-hidden shadow-xl hover:shadow-2xl transition-shadow">
                    <!-- Car Image -->
                    <div class="relative h-64 bg-gradient-to-br from-gray-700 to-gray-800 flex items-center justify-center p-8">
                        <img
                                [src]="car.image"
                                [alt]="car.name"
                                class="w-full h-full object-contain"
                        />
                    </div>

                    <!-- Car Info -->
                    <div class="p-6">
                        <div class="flex items-start justify-between mb-4">
                            <div>
                                <h3 class="text-2xl font-black text-white mb-1">{{ car.name }} <span class="text-gray-400 text-base font-normal">or similar</span></h3>
                                <p class="text-gray-400 text-sm">{{ car.category }}</p>
                            </div>
                        </div>

                        <!-- Price -->
                        <div class="flex items-end justify-between">
                            <div>
                                <p class="text-gray-400 text-sm mb-1">from</p>
                                <p class="text-white">
                                    <span class="text-4xl font-black">${{ car.price }}</span>
                                    <span class="text-lg text-gray-400">.01 / day</span>
                                </p>
                            </div>
                            <button class="bg-transparent border-2 border-white text-white px-6 py-2 rounded-full font-semibold hover:bg-white hover:text-black transition-colors">
                                Book Now
                            </button>
                        </div>
                    </div>
                </div>
            }
        </div>
    </div>
</section>
