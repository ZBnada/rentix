<div class="w-full max-w-6xl mx-auto px-4">
    <div class="bg-white rounded-xl shadow-2xl p-4">
        <!-- Tabs -->
        <div class="flex gap-2 mb-4 border-b border-gray-200">
            @for (tab of tabs; track tab.id) {
                <button
                        (click)="selectTab(tab.id)"
                        [ngClass]="{
            'border-b-2 border-black text-black': activeTab() === tab.id,
            'text-gray-500 hover:text-gray-700': activeTab() !== tab.id
          }"
                        class="flex items-center gap-1 px-4 py-2 font-semibold transition-colors text-sm">
                    <span [innerHTML]="getIcon(tab.icon)"></span>
                    {{ tab.label }}
                </button>
            }
        </div>

        <!-- Form Content - Une seule ligne -->
        <div class="grid grid-cols-1 lg:grid-cols-7 gap-3 items-end">
            <!-- Pickup Location -->
            <div class="lg:col-span-2">
                <label class="block text-xs font-semibold text-gray-700 mb-1">Pickup & return</label>
                <div class="relative">
                    <div class="absolute left-2 top-1/2 -translate-y-1/2 text-gray-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                        </svg>
                    </div>
                    <input
                            type="text"
                            [(ngModel)]="pickupLocation"
                            class="w-full pl-8 pr-2 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                            placeholder="Athens Airport"
                    />
                </div>
            </div>

            <!-- Pickup Date -->
            <div class="lg:col-span-1">
                <label class="block text-xs font-semibold text-gray-700 mb-1">Pickup date</label>
                <input
                        type="date"
                        [(ngModel)]="pickupDate"
                        class="w-full px-2 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                />
            </div>

            <!-- Pickup Time -->
            <div class="lg:col-span-1">
                <label class="block text-xs font-semibold text-gray-700 mb-1">&nbsp;</label>
                <input
                        type="time"
                        [(ngModel)]="pickupTime"
                        class="w-full px-2 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                />
            </div>

            <!-- Return Date -->
            <div class="lg:col-span-1">
                <label class="block text-xs font-semibold text-gray-700 mb-1">Return date</label>
                <input
                        type="date"
                        [(ngModel)]="returnDate"
                        class="w-full px-2 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                />
            </div>

            <!-- Return Time -->
            <div class="lg:col-span-1">
                <label class="block text-xs font-semibold text-gray-700 mb-1">&nbsp;</label>
                <input
                        type="time"
                        [(ngModel)]="returnTime"
                        class="w-full px-2 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                />
            </div>

            <!-- Submit Button -->
            <div class="lg:col-span-1">
                <button
                        (click)="showCars()"
                        class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-4 rounded-lg transition-colors text-sm whitespace-nowrap">
                    Show cars
                </button>
            </div>
        </div>

        <!-- Options Row -->
        <div class="flex items-center gap-4 mt-3 text-xs">
            <button
                    (click)="toggleDifferentLocation()"
                    class="text-gray-600 hover:text-orange-500 flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Different return location
            </button>

            <button class="text-gray-600 hover:text-orange-500 underline">
                Apply corporate rate
            </button>
        </div>
    </div>

    <!-- Promo Badge en dessous -->
    <div class="mt-3 bg-gray-800 rounded-lg p-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <span class="bg-orange-500 text-white font-bold px-2 py-1 rounded text-xs">-15%</span>
            <span class="text-white font-medium text-xs">Rent between Sunday and Wednesday and enjoy up to 15% savings!</span>
        </div>
        <button class="text-orange-500 hover:text-orange-400 font-semibold text-xs whitespace-nowrap">
            Get your deal
        </button>
    </div>
</div>
