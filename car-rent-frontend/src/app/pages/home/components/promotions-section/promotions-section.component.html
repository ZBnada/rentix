<section class="bg-white py-16 md:py-20">
    <div class="max-w-7xl mx-auto px-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            @for (promo of promotions; track promo.title) {
                <div class="relative rounded-2xl overflow-hidden shadow-xl group cursor-pointer">
                    <!-- Image -->
                    <div class="relative h-80 overflow-hidden">
                        <img
                                [src]="promo.image"
                                [alt]="promo.title"
                                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                        />
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent"></div>
                    </div>

                    <!-- Content -->
                    <div class="absolute bottom-0 left-0 right-0 p-8 text-white">
                        <!-- Badge -->
                        <div class="inline-block border-2 border-white px-4 py-2 mb-4">
                            <span class="text-sm font-bold">{{ promo.badge }}</span>
                        </div>

                        <!-- Title -->
                        <h3 class="text-2xl md:text-3xl font-black mb-2">{{ promo.title }}</h3>

                        <!-- Description -->
                        <p class="text-base mb-6">{{ promo.description }}</p>

                        <!-- Button -->
                        <button class="bg-transparent border-2 border-white text-white px-6 py-2 rounded-full font-semibold hover:bg-white hover:text-black transition-colors">
                            Book now
                        </button>
                    </div>
                </div>
            }
        </div>
    </div>
</section>
